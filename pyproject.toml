[project]
name = "organizational-restructuring-agent"
version = "0.1.0"
description = "Compute-first organizational restructuring consultant for synthetic ticket events"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "duckdb>=1.1,<2",
  "pandas>=2.2,<3",
  "networkx>=3.3,<4",
  "simpy>=4.1,<5",
  "httpx2>=0.1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
